version: '3.8'

services:
  shard-0:
    image: postgres:15-alpine
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=sharding_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard-1:
    image: postgres:15-alpine
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=sharding_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard-2:
    image: postgres:15-alpine
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=sharding_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  simple-user-service:
    build:
      context: ./simple-user-service
    ports:
      - "8082:8081"
    depends_on:
      shard-0:
        condition: service_healthy
      shard-1:
        condition: service_healthy
      shard-2:
        condition: service_healthy
    environment:
      - SHARD_DEFAULT=shard-0
      - SHARD_DB=sharding_db
      - SHARD_USERNAME=postgres
      - SHARD_PASSWORD=postgres
      - SHARD_0_HOST=shard-0
      - SHARD_0_PORT=5432
      - SHARD_1_HOST=shard-1
      - SHARD_1_PORT=5432
      - SHARD_2_HOST=shard-2
      - SHARD_2_PORT=5432

