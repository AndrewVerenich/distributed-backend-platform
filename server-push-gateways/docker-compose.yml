version: '3.8'

x-gateway-env: &gateway-env
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: bash -c "
      kafka-topics --create --if-not-exists \
      --bootstrap-server kafka:9092 \
      --topic push.server.event \
      --partitions 3 \
      --replication-factor 1"

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  event-bridge:
    build:
      context: ./event-bridge
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  event-producer-demo:
    build:
      context: ./event-producer-demo
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    ports:
      - "8097:8097"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: "8097"
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8097/actuator/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  push-gateway-1:
    build:
      context: ./push-gateway
    depends_on:
      redis:
        condition: service_healthy
      event-bridge:
        condition: service_healthy
    ports:
      - "8086:8080"
    environment:
      <<: *gateway-env
      HOSTNAME: push-gateway-1
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  push-gateway-2:
    build:
      context: ./push-gateway
    depends_on:
      redis:
        condition: service_healthy
      event-bridge:
        condition: service_healthy
    environment:
      <<: *gateway-env
      HOSTNAME: push-gateway-2
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  push-gateway-3:
    build:
      context: ./push-gateway
    depends_on:
      redis:
        condition: service_healthy
      event-bridge:
        condition: service_healthy
    environment:
      <<: *gateway-env
      HOSTNAME: push-gateway-3
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.25
    depends_on:
      push-gateway-1:
        condition: service_healthy
      push-gateway-2:
        condition: service_healthy
      push-gateway-3:
        condition: service_healthy
    ports:
      - "8888:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v2.50.0
    ports: [ "9095:9090" ]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - push-gateway-1
      - push-gateway-2
      - push-gateway-3
      - event-bridge
      - event-producer-demo

  grafana:
    image: grafana/grafana:10.3.1
    ports: [ "3003:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
