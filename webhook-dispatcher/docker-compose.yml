x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: webhook
  DB_PASSWORD: webhook
  KAFKA_BOOTSTRAP: kafka:9092
  SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/webhook
  SPRING_R2DBC_USERNAME: webhook
  SPRING_R2DBC_PASSWORD: webhook
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:15-alpine
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports:
      - "5439:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2182:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic webhook.event --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic webhook.notification --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic webhook.dlq --partitions 1 --replication-factor 1

  debezium:
    image: debezium/connect:2.5
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8084:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: webhook-debezium
      CONFIG_STORAGE_TOPIC: webhook_debezium_configs
      OFFSET_STORAGE_TOPIC: webhook_debezium_offsets
      STATUS_STORAGE_TOPIC: webhook_debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT: "ENABLED"
      CONNECT_CONSUMER_ISOLATION_LEVEL: "read_committed"
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/init-debezium.sh:/init-debezium.sh
    entrypoint: ["sh", "/init-debezium.sh"]

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      - KAFKA_BROKERS=kafka:9092

  demo-receiver:
    build:
      context: ./demo-receiver
    ports:
      - "8243:8243"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8243/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  webhook-api:
    build:
      context: ./webhook-api
    ports:
      - "8240:8240"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8240/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  event-processor:
    build:
      context: ./event-processor
    ports:
      - "8241:8241"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8241/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  delivery-worker:
    build:
      context: ./delivery-worker
    ports:
      - "8242:8242"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      demo-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8242/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - webhook-api
      - event-processor
      - delivery-worker
      - demo-receiver

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3008:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
