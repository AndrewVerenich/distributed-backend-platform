server:
  port: 8081

spring:
  application:
    name: auth-service
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/auth_db
    username: admin
    password: admin
  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: "MySecretKeyForJWTTokenGenerationAndValidation1234567890"
  access-expiration: "PT15M"
  refresh-expiration: "P30D"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.andver.auth: DEBUG
    org.springframework.security: INFO
