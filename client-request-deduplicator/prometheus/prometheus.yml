global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'client-request-deduplicator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'simple-client-microservice:7777'
        labels:
          system: 'client-request-deduplicator'
