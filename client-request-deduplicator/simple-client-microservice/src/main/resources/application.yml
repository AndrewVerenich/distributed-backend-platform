server:
  port: 7777

spring:
  data:
    redis:
      host: localhost
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
request:
  deduplicator:
    enabled: true
    rules:
      - method: POST
        url: "/test"
        ttl: "PT10S"
        exclude-fields: []
        exclude-query-params: []