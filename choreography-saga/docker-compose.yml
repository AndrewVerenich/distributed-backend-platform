version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: choreography-postgres
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init.sh
      - ./postgres/schemas:/schemas:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d booking" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2182:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        for t in domain.booking-requested domain.flight-booked domain.flight-booking-failed domain.flight-booking-cancelled domain.hotel-booked domain.hotel-booking-failed domain.car-rented domain.car-rental-failed domain.booking-completed domain.booking-compensated; do
          kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic $$t --partitions 2 --replication-factor 1
        done

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8089:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092

  debezium:
    image: debezium/connect:2.5
    container_name: choreography-debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8084:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: choreography
      CONFIG_STORAGE_TOPIC: choreography_debezium_configs
      OFFSET_STORAGE_TOPIC: choreography_debezium_offsets
      STATUS_STORAGE_TOPIC: choreography_debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      PLUGIN_PATH: /kafka/connect
      CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT: "ENABLED"
      CONNECT_CONSUMER_ISOLATION_LEVEL: "read_committed"
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      CONNECT_PRODUCER_TRANSACTION_TIMEOUT_MS: 60000
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/init-debezium.sh:/init-debezium.sh
    entrypoint: [ "sh", "/init-debezium.sh" ]

  travel-booking-api:
    build:
      context: ./travel-booking-api
    ports: [ "8100:8100" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/booking
      SPRING_R2DBC_USERNAME: demo
      SPRING_R2DBC_PASSWORD: demo
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  travel-flight-service:
    build:
      context: ./travel-flight-service
    ports: [ "8102:8102" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/flight
      SPRING_R2DBC_USERNAME: demo
      SPRING_R2DBC_PASSWORD: demo
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHOREOGRAPHY_FAILURE_RATE: "0.0"
    restart: on-failure

  travel-hotel-service:
    build:
      context: ./travel-hotel-service
    ports: [ "8103:8103" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/hotel
      SPRING_R2DBC_USERNAME: demo
      SPRING_R2DBC_PASSWORD: demo
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHOREOGRAPHY_FAILURE_RATE: "0.0"
    restart: on-failure

  travel-car-service:
    build:
      context: ./travel-car-service
    ports: [ "8104:8104" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/car
      SPRING_R2DBC_USERNAME: demo
      SPRING_R2DBC_PASSWORD: demo
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHOREOGRAPHY_FAILURE_RATE: "0.0"
      CHOREOGRAPHY_MAX_RETRIES: "3"
    restart: on-failure

  saga-state-tracker:
    build:
      context: ./saga-state-tracker
    ports: [ "8101:8101" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/tracker
      SPRING_R2DBC_USERNAME: demo
      SPRING_R2DBC_PASSWORD: demo
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRACKER_HANG_AFTER_SECONDS: "30"
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.50.0
    ports: [ "9091:9090" ]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - travel-booking-api
      - saga-state-tracker

  grafana:
    image: grafana/grafana:10.3.1
    ports: [ "3002:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
