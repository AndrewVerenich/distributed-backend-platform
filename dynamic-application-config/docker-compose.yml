version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: master
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d master" ]
      interval: 10s
      timeout: 5s
      retries: 5

  configs-fill:
    image: postgres:15
    depends_on:
      debezium-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: master
      PGPASSWORD: demo
    volumes:
      - ./postgres/insert.sql:/docker-entrypoint-initdb.d/insert.sql
    entrypoint: [ "psql", "-h", "postgres", "-U", "demo", "-d", "master", "-f", "/docker-entrypoint-initdb.d/insert.sql" ]

  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      PLUGIN_PATH: /kafka/connect
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/init-debezium.sh:/init-debezium.sh
    entrypoint: [ "sh", "/init-debezium.sh" ]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: bash -c "
      kafka-topics --create
      --bootstrap-server kafka:9092
      --topic config-state
      --partitions 1
      --replication-factor 1
      --config segment.ms=1000
      --config min.cleanable.dirty.ratio=0.01
      --config cleanup.policy=compact"

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092

  dynamic-config-engine:
    build:
      context: ./dynamic-config-engine
    depends_on:
      debezium-init:
        condition: service_completed_successfully
    restart: on-failure

  simple-microservice-1:
    build:
      context: ./simple-microservice
    ports: [ "9001:8080" ]
    depends_on:
      dynamic-config-engine:
        condition: service_started
    restart: on-failure

  simple-microservice-2:
    build:
      context: ./simple-microservice
    ports: [ "9002:8080" ]
    depends_on:
      dynamic-config-engine:
        condition: service_started
    restart: on-failure
