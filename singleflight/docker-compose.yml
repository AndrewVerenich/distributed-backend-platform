x-demo: &demo
  build:
    context: ./demo-api-service
  depends_on:
    redis:
      condition: service_healthy
    slow-upstream:
      condition: service_healthy
  restart: on-failure
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8221/actuator/health >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s
  environment: &demo-env
    SERVER_PORT: "8221"
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    UPSTREAM_BASE_URL: http://slow-upstream:8220
    SINGLEFLIGHT_NAMESPACE: demo

services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6384:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  slow-upstream:
    build:
      context: ./slow-upstream
    ports:
      - "8220:8220"
    environment:
      SERVER_PORT: "8220"
      UPSTREAM_DELAY_MS: "100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8220/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  demo-off-1:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-off-1
      SINGLEFLIGHT_MODE: off

  demo-off-2:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-off-2
      SINGLEFLIGHT_MODE: off

  demo-off-3:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-off-3
      SINGLEFLIGHT_MODE: off

  demo-local-1:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-local-1
      SINGLEFLIGHT_MODE: local

  demo-local-2:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-local-2
      SINGLEFLIGHT_MODE: local

  demo-local-3:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-local-3
      SINGLEFLIGHT_MODE: local

  demo-distributed-1:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-distributed-1
      SINGLEFLIGHT_MODE: distributed

  demo-distributed-2:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-distributed-2
      SINGLEFLIGHT_MODE: distributed

  demo-distributed-3:
    <<: *demo
    environment:
      <<: *demo-env
      SPRING_APPLICATION_NAME: demo-distributed-3
      SINGLEFLIGHT_MODE: distributed

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8221:8221"
      - "8222:8222"
      - "8223:8223"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - demo-off-1
      - demo-off-2
      - demo-off-3
      - demo-local-1
      - demo-local-2
      - demo-local-3
      - demo-distributed-1
      - demo-distributed-2
      - demo-distributed-3

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9108:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - demo-off-1
      - demo-local-1
      - demo-distributed-1
      - slow-upstream

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3016:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
