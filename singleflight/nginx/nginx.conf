worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream demo_off {
    least_conn;
    server demo-off-1:8221;
    server demo-off-2:8221;
    server demo-off-3:8221;
  }

  upstream demo_local {
    least_conn;
    server demo-local-1:8221;
    server demo-local-2:8221;
    server demo-local-3:8221;
  }

  upstream demo_distributed {
    least_conn;
    server demo-distributed-1:8221;
    server demo-distributed-2:8221;
    server demo-distributed-3:8221;
  }

  server {
    listen 8221;
    location / {
      proxy_pass http://demo_off;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  server {
    listen 8222;
    location / {
      proxy_pass http://demo_local;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  server {
    listen 8223;
    location / {
      proxy_pass http://demo_distributed;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
