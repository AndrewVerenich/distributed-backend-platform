worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream charge_upstream {
    least_conn;
    server demo-charge-1:8221;
    server demo-charge-2:8221;
  }

  server {
    listen 8220;

    location / {
      proxy_pass http://charge_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
  }
}
