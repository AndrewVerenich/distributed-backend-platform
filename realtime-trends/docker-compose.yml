version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: bash -c "
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic product-view \
      --partitions 2 \
      --replication-factor 1 && \
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic product-view-counts \
      --partitions 1 \
      --replication-factor 1"

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092

  product-view-generator:
    build:
      context: ./product-view-generator
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    restart: on-failure

  trends-analyzer:
    build:
      context: ./trends-analyzer
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    restart: on-failure

  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    ports:
      - "9090:9090"
    environment:
      KSQL_BOOTSTRAP_SERVERS: "kafka:9092"
      KSQL_LISTENERS: "http://0.0.0.0:9090"
      KSQL_KSQL_SERVICE_ID: "ksql_service"

  ksqldb-init:
    image: curlimages/curl:8.5.0
    depends_on:
      - ksqldb-server
    volumes:
      - ./ksql/init.sh:/init.sh
    entrypoint: sh /init.sh

  
  
  
