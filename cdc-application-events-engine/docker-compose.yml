version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: master
    command: --default-authentication-plugin=mysql_native_password --binlog-format=ROW --binlog-row-image=FULL --gtid-mode=ON --enforce-gtid-consistency=ON
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "mysql -h localhost -uadmin -padmin -D master -e 'SELECT 1 FROM user LIMIT 1;'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      PLUGIN_PATH: /kafka/connect
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/init-debezium.sh:/init-debezium.sh
    entrypoint: [ "sh", "/init-debezium.sh" ]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: bash -c "
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic credit-cancelled \
      --partitions 2 \
      --replication-factor 1 && \
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic credit-created \
      --partitions 2 \
      --replication-factor 1 && \
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic credit-expired \
      --partitions 2 \
      --replication-factor 1 && \
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic payment-received \
      --partitions 2 \
      --replication-factor 1 && \
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic user-block \
      --partitions 2 \
      --replication-factor 1 && \
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic user-created \
      --partitions 2 \
      --replication-factor 1 && \
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic user-personal-data-change \
      --partitions 1 \
      --replication-factor 1"

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092

  application-events-handler:
    build:
      context: ./application-events-handler
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    environment:
      - CAMEL_SPRINGBOOT_ROUTES_INCLUDE_PATTERN=file:/app/routes/**/*.yaml
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./routes:/app/routes
    restart: on-failure
