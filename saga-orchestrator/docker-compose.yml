version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: master
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d master" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: bash -c "
      kafka-topics --create --bootstrap-server kafka:9092 --topic saga.command.flight-service --partitions 2 --replication-factor 1 &&
      kafka-topics --create --bootstrap-server kafka:9092 --topic saga.command.hotel-service --partitions 2 --replication-factor 1 &&
      kafka-topics --create --bootstrap-server kafka:9092 --topic saga.command.car-service --partitions 2 --replication-factor 1 &&
      kafka-topics --create --bootstrap-server kafka:9092 --topic saga.reply --partitions 2 --replication-factor 1"

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092

  saga-orchestrator-engine:
    build:
      context: ./saga-orchestrator-engine
    ports: [ "8090:8090" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/master
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  travel-flight-service:
    build:
      context: ./travel-flight-service
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  travel-hotel-service:
    build:
      context: ./travel-hotel-service
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  travel-car-service:
    build:
      context: ./travel-car-service
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  saga-dashboard-ui:
    build:
      context: ./saga-dashboard-ui
    ports: [ "3000:80" ]
    depends_on:
      saga-orchestrator-engine:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.50.0
    ports: [ "9090:9090" ]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      saga-orchestrator-engine:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.3.1
    ports: [ "3001:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
