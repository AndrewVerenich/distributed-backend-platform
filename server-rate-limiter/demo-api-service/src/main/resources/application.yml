server:
  port: ${SERVER_PORT:8210}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:demo-api}
  data:
    redis:
      # Used only when rate-limiter.sharding.enabled=false (local single-node).
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6383}

rate-limiter:
  enabled: true
  algorithm: ${RATE_LIMITER_ALGORITHM:token-bucket}
  key-prefix: ${RATE_LIMITER_KEY_PREFIX:rl}
  on-redis-error: reject
  key:
    strategy: header
    header: X-User-Id
    fallback-to-ip: true
  filter:
    enabled: true
    exclude-path-prefixes:
      - /actuator
  sharding:
    enabled: ${RATE_LIMITER_SHARDING_ENABLED:true}
    single-shard-name: default
    nodes:
      - name: shard-0
        host: ${RATE_LIMITER_SHARD_0_HOST:localhost}
        port: ${RATE_LIMITER_SHARD_0_PORT:6383}
      - name: shard-1
        host: ${RATE_LIMITER_SHARD_1_HOST:localhost}
        port: ${RATE_LIMITER_SHARD_1_PORT:6393}
      - name: shard-2
        host: ${RATE_LIMITER_SHARD_2_HOST:localhost}
        port: ${RATE_LIMITER_SHARD_2_PORT:6394}
  rules:
    - name: catalog
      path-prefixes:
        - /api/catalog
      limit: 20
      window: 1s
      burst: 20
    - name: checkout
      path-prefixes:
        - /api/checkout
      limit: 5
      window: 1s
      burst: 20
    - name: search
      path-prefixes:
        - /api/search
      limit: 10
      window: 1s
      burst: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${SPRING_APPLICATION_NAME:demo-api}
    distribution:
      percentiles-histogram:
        rl_check: true
