server:
  port: 8081

spring:
  application:
    name: bff-web

bff:
  backend:
    user-service-base-url: ${USER_SERVICE_URL:http://localhost:8091}
    product-service-base-url: ${PRODUCT_SERVICE_URL:http://localhost:8092}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      webDashboard:
        baseConfig: default
      webProducts:
        baseConfig: default
      webProductById:
        baseConfig: default
      webUserMe:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.andver.bff.web: DEBUG
