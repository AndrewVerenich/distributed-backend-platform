global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'distributed-hash-map'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'demo-client-service-a:8081'
          - 'demo-client-service-b:8082'
        labels:
          system: 'distributed-hash-map'
