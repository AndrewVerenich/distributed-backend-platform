server:
  port: 8081

spring:
  application:
    name: demo-client-service-a
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: demo-client-service-a

distributed:
  map:
    enabled: true
    node-id: ${NODE_ID:service-a}
    bootstrap:
      timeout: 60s
    cleanup:
      interval: 30s
      tombstone-retention: 2m
    maps:
      user-cache:
        value-type: com.andver.dhm.demo.a.UserProfile
        partitions: 3
        replication-factor: 1
