version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-reservation:
    build:
      context: .
    ports:
      - "8230:8230"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/booking
      SPRING_R2DBC_USERNAME: booking
      SPRING_R2DBC_PASSWORD: booking
      BOOKING_HOLD_TTL: 5s
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8230/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9098:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - booking-reservation

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3007:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
