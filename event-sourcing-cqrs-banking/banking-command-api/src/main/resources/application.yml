spring:
  application:
    name: banking-command-api
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/master
    username: admin
    password: admin
  datasource:
    driver-class-name: org.postgresql.Driver
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: banking-command-api
    distribution:
      percentiles-histogram:
        es_command_append_seconds: true
