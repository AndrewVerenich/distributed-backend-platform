version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: master
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d master" ]
      interval: 10s
      timeout: 5s
      retries: 5

  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      PLUGIN_PATH: /kafka/connect

      CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT: "ENABLED"
      CONNECT_CONSUMER_ISOLATION_LEVEL: "read_committed"
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      CONNECT_PRODUCER_TRANSACTION_TIMEOUT_MS: 60000
    volumes:
      - ./debezium/connectors:/etc/kafka-connect/connectors
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/init-debezium.sh:/init-debezium.sh
    entrypoint: [ "sh", "/init-debezium.sh" ]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      KAFKA_PRODUCER_TRANSACTION_TIMEOUT_MS: 60000
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    command: bash -c "
      kafka-topics --create \
      --bootstrap-server kafka:9092 \
      --topic debezium.public.event_store \
      --partitions 2 \
      --replication-factor 1"

  banking-command-api:
    build:
      context: ./banking-command-api
    ports: [ "8081:8081" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/master
    restart: on-failure

  projection-balance:
    build:
      context: ./projection-balance
    ports: [ "8082:8082" ]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/master
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure


