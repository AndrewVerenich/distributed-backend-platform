global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'event-sourcing-cqrs-banking'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'banking-command-api:8081'
          - 'projection-balance:8082'
          - 'banking-query-api:8084'
        labels:
          system: 'event-sourcing-cqrs-banking'
