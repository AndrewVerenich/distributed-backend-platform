server:
  port: 8101

spring:
  application:
    name: demo-client-dumb

demo:
  dependency:
    base-url: ${DEPENDENCY_URL:http://localhost:8100}
  pool:
    max-connections: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.andver.circuitbreaker: INFO
